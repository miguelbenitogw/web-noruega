<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlobalWorking Talent Portal – produktomvisning</title>
<!--
  =====================================================================
  GlobalWorking Talent Portal – selvspillende produktomvisning
  =====================================================================
  EMBED (iframe):
    <iframe src="tutorial-talent-portal/index.html" title="GlobalWorking Talent Portal"
            style="width:100%;aspect-ratio:16/9;border:0;border-radius:16px"
            loading="lazy" allow="fullscreen"></iframe>
    (Høyden til iframen bør være ca. 16:9 + 70px for kontrollene, se embed.html.)

  EDIT TEXTS : alle tekster ligger i ordboken `DICT` (nb + en) i <script>-blokken.
               Bildetekster = nøklene `cap.<id>.t` (tittel) og `cap.<id>.d` (setning).
  EDIT TIMING: `CHAPTERS` i scriptet. Hvert kapittel har `dur` (sekunder) og en liste
               med steg: S(sekund, fn) eller T(sekund, varighet, fn). Tider er relative
               til kapittelstart.
  CTA-LENKE  : konstanten CTA_URL øverst i scriptet (standard "#kontakt").
  =====================================================================
-->
<style>
/* Inter + Outfit = la MAQUETA del portal (producto real, no se toca).
   Poppins + Newsreader = el MANDO (tipografía de marca Global Working). */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&family=Poppins:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap');

:root{
  --navy:#003D7C; --navy-700:#002f60; --navy-50:#eaf1f9; --navy-100:#d3e2f3;
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s900:#0f172a;
  --em:#10b981; --em-bg:#ecfdf5; --em-fg:#047857;
  --am:#f59e0b; --am-bg:#fffbeb; --am-fg:#b45309;
  --vi:#8b5cf6; --vi-bg:#f5f3ff; --vi-fg:#6d28d9;
  --rose:#e11d48;
  --head:'Outfit','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mv:.85s;

  /* ---- MANDO: tokens de marca (tailwind.config.js + src/index.css) ----
     Nada de esto entra en la maqueta del portal; vive solo en el mando. */
  --gw-navy:#062A6A; --gw-navy-deep:#041E4D; --gw-blue:#1E73BE;
  --gw-primary-800:#0A3A82; --gw-primary-300:#8FB6E0; --gw-primary-200:#BCD3EC;
  --gw-ember:#DB532E; --gw-ember-600:#B9411F;
  --gw-ink:#0E1A2B; --gw-ink-muted:#4A5A70; --gw-ink-soft:#6F7F95;
  --gw-line:#D8E1EE; --gw-frost:#E7EDF6; --gw-surface:#F1F4F9;
  --gw-ui:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gw-serif:'Newsreader',Georgia,'Times New Roman',serif;
  --gw-r-surface:14px;   /* radio de superficie */
  --gw-r-pill:999px;     /* radio de acción */
}
*{box-sizing:border-box;margin:0;padding:0}
/* El hueco que sobraba bajo la barra era alto de iframe que nadie pintaba: la
   página era transparente y el navy que se veía era el del `bg-navy` de
   `/talentportalen`. Ahora la página tiene campo propio EN ESE MISMO navy
   (#062A6A) y el reproductor se centra en él: lo que sobra es margen, no
   agujero, y a pantalla completa deja de salir sobre blanco. */
html{height:100%}
body{min-height:100%;background:var(--gw-navy)}
body{font-family:var(--body);color:var(--s900);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.player{max-width:1280px;margin:0 auto;outline:none;min-height:100svh;padding:0 12px;
  display:flex;flex-direction:column}
/* Escenario y narración tienen que caber juntos en el alto disponible. Con el
   ancho completo, el escenario (proporción 1280/632) más la narración se
   pasaban: en el iframe de 720 px de /talentportalen sumaban 755 y salía una
   barra de scroll. Esconder el desbordamiento cortaría la narración, así que
   el reproductor se estrecha hasta que la pieza entera entra. El alto de la
   narración cambia con cada capítulo: lo mide un ResizeObserver y lo deja en
   --deck-h. Los 24 px son el padding lateral del reproductor. */
.player{max-width:min(1280px, calc((100svh - var(--deck-h, 140px)) * 1280 / 632 + 24px))}
/* Márgenes automáticos, no `justify-content:center`: cuando el alto no alcanza
   se resuelven a 0 en vez de recortar por arriba. */
.wrap{position:relative;width:100%;aspect-ratio:1280/632;flex:0 1 auto;min-height:0;margin-top:auto;
  overflow:hidden;border-radius:var(--gw-r-surface) var(--gw-r-surface) 0 0;background:#dfe9f6}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font-size:14px;
  background:radial-gradient(900px 500px at 15% 0%,#cfe0f4 0,transparent 70%),radial-gradient(900px 500px at 100% 100%,#d9e6f5 0,transparent 70%),#e8eff8}

/* ---------- window ---------- */
.win{position:absolute;left:24px;top:14px;width:1232px;height:604px;background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 34px 60px -24px rgba(0,40,90,.4),0 0 0 1px rgba(15,23,42,.07)}
.chrome{height:26px;background:var(--s100);border-bottom:1px solid var(--s200);display:flex;align-items:center;gap:6px;padding:0 12px}
.chrome i{width:9px;height:9px;border-radius:50%;background:var(--s300)}
.chrome span{flex:1;text-align:center;font-size:11px;color:var(--s500);margin-right:40px}
.content{position:absolute;left:0;top:26px;width:1232px;height:578px;overflow:hidden;background:var(--s50)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.scene.on{opacity:1;visibility:visible;transition-delay:0s}

/* ---------- shared bits ---------- */
.logo{font:700 20px var(--head);color:var(--navy);letter-spacing:-.02em}
.logo span{font-weight:500}
.input{position:relative;height:42px;border:1.5px solid var(--s200);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:14px;transition:border-color .25s,box-shadow .25s}
.input.focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,61,124,.12)}
.input .ph{color:var(--s400)} .input.has .ph{display:none}
.input .caret{width:1.5px;height:18px;background:var(--navy);margin-left:1px;opacity:0}
.input.focus .caret{opacity:1;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-avail{background:var(--em-bg);color:var(--em-fg)} .st-train{background:var(--am-bg);color:var(--am-fg)} .st-busy{background:var(--vi-bg);color:var(--vi-fg)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:7px;background:var(--s100);color:var(--s600);font-size:11px;font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .15s,background .25s}
.btn-p{background:var(--navy);color:#fff;box-shadow:0 8px 18px -8px rgba(0,61,124,.7)}
.btn-s{background:#fff;color:var(--navy);border:1.5px solid var(--navy-100)}
.btn-g{background:var(--s100);color:var(--s700)}
.press{transform:scale(.96)}
.av{border-radius:50%;overflow:hidden;flex:none}
.av svg{display:block;width:100%;height:100%}

/* ---------- login ---------- */
.lg{display:grid;grid-template-columns:1fr 1fr;height:100%}
.lg-left{background:linear-gradient(155deg,#004a96 0,var(--navy) 45%,#002a55 100%);color:#fff;padding:54px 64px;position:relative;overflow:hidden}
.lg-left:before{content:"";position:absolute;right:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.05)}
.lg-left .logo{color:#fff;font-size:24px}
.lg-head{margin-top:70px;display:inline-block}
.lg-head h1{font:600 38px/1.12 var(--head);letter-spacing:-.02em;max-width:470px}
.lg-pts{margin-top:30px;display:grid;gap:14px}
.lg-pts div{display:flex;align-items:center;gap:12px;font-size:16px;color:#dbe7f5}
.lg-pts svg{flex:none;width:26px;height:26px;padding:5px;border-radius:50%;background:rgba(255,255,255,.14);stroke:#fff}
.lg-right{display:flex;align-items:center;justify-content:center;background:var(--s50)}
.lg-card{width:430px;background:#fff;border-radius:24px;padding:30px 34px;box-shadow:0 20px 40px -20px rgba(15,23,42,.25);border:1px solid var(--s200)}
.lg-card h2{font:600 24px var(--head);color:var(--navy)}
.lg-card .sub{color:var(--s500);margin:4px 0 18px;font-size:13.5px}
.lg-card label{display:block;font-size:12.5px;font-weight:600;color:var(--s700);margin:12px 0 6px}
.lg-card .btn{width:100%;margin-top:18px}
.lg-card .btn.load{pointer-events:none;background:var(--navy-700)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;display:none;animation:rot .7s linear infinite}
.load .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.lg-or{display:flex;align-items:center;gap:10px;color:var(--s400);font-size:12px;margin:18px 0 12px}
.lg-or:before,.lg-or:after{content:"";flex:1;height:1px;background:var(--s200)}
.lg-explore{border:1.5px dashed var(--navy-100);border-radius:16px;padding:12px 14px;background:var(--navy-50)}
.lg-explore b{font:600 14px var(--head);color:var(--navy)}
.lg-explore .row{display:flex;gap:10px;margin-top:10px}
.lg-explore .row .btn{height:36px;margin:0;font-size:13px;flex:1}

/* ---------- portal chrome ---------- */
.ahead{height:52px;background:#fff;border-bottom:1px solid var(--s200);display:flex;align-items:center;padding:0 24px;gap:12px}
.ahead .tag{font-size:12px;color:var(--s500);border-left:1px solid var(--s200);padding-left:12px}
.ahead .usr{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--s700)}
.ahead .usr b{width:28px;height:28px;border-radius:50%;background:var(--navy-50);color:var(--navy);display:grid;place-items:center;font:600 13px var(--head)}
.pbody{display:flex;height:526px}
.side{width:224px;background:#fff;border-right:1px solid var(--s200);padding:16px 12px}
.side h4{font:600 11.5px var(--body);color:var(--s400);margin:4px 12px 8px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:500;color:var(--s700);margin-bottom:3px;transition:background .25s,color .25s}
.nv.on{background:var(--navy-50);color:var(--navy);font-weight:600}
.nv .d{width:9px;height:9px;border-radius:50%;flex:none}
.nv em{margin-left:auto;font-style:normal;font-size:12px;background:var(--s100);color:var(--s600);padding:1px 8px;border-radius:99px}
.nv.on em{background:#fff}
.main{flex:1;position:relative}
.pane{position:absolute;inset:18px 24px 0;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.pane.on{opacity:1;visibility:visible;transition-delay:0s}
.ptitle{display:flex;align-items:baseline;gap:12px;height:28px;margin-bottom:10px}
.ptitle h2{font:600 22px var(--head);color:var(--s900);letter-spacing:-.01em}
.ptitle small{color:var(--s500);font-size:13px}
.frow{display:flex;align-items:center;gap:10px;height:38px;margin-bottom:14px;position:relative}
.search{width:330px;height:38px}
.search svg{flex:none;margin-right:8px;stroke:var(--s400)}
.fchip{position:relative;height:38px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1.5px solid var(--s200);border-radius:12px;background:#fff;font-size:13px;font-weight:500;color:var(--s700);transition:border-color .25s,background .25s}
.fchip.act,.fchip.open{border-color:var(--navy);background:var(--navy-50);color:var(--navy)}
.pop{position:absolute;left:0;top:44px;min-width:170px;background:#fff;border-radius:14px;border:1px solid var(--s200);box-shadow:0 18px 36px -12px rgba(15,23,42,.3);padding:6px;opacity:0;transform:translateY(-6px);visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s;z-index:20}
.fchip.open .pop{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.pop .opt{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--s700);font-weight:500;transition:background .2s}
.pop .opt.on{background:var(--navy-50);color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:196px;gap:14px}
.cand{background:#fff;border:1px solid var(--s200);border-radius:20px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04);display:flex;flex-direction:column;overflow:hidden;position:relative}
.cand.gone{display:none}
.cand.pop-in{animation:popin .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.c-top{display:flex;gap:12px;align-items:center}
.c-top .av{width:54px;height:54px}
.c-name{font:600 16px/1.2 var(--head);color:var(--s900)}
.c-prof{font-size:12px;color:var(--s500);margin:2px 0 5px}
.heart{margin-left:auto;align-self:flex-start;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s100);transition:background .25s,transform .2s}
.heart svg{width:16px;height:16px;fill:none;stroke:var(--s400);stroke-width:2;transition:all .25s}
.heart.on{background:#ffe4e6}.heart.on svg{fill:var(--rose);stroke:var(--rose)}
.cand .pill{margin-top:8px;align-self:flex-start}
.c-from{font-size:12px;color:var(--s600);margin-top:5px;font-weight:500}
.c-sum{font-size:12px;line-height:16px;color:var(--s500);margin-top:3px;height:32px;overflow:hidden}
.c-foot{margin-top:auto}
.c-foot .vp{width:100%;height:26px;border-radius:9px;background:var(--navy-50);color:var(--navy);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,transform .15s}

/* ---------- mine ---------- */
.stp{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:14px;background:#fff;border:1px solid var(--s200);border-radius:20px;padding:6px}
.stg{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative}
.stg + .stg:before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;border-top:2px solid var(--s300);border-right:2px solid var(--s300);transform:translateY(-50%) rotate(45deg)}
.stg b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--head);color:#fff}
.stg span{font:600 15px var(--head);color:var(--s900)} .stg small{display:block;font:400 12px var(--body);color:var(--s500)}
.s0b{background:#6b9bd1}.s1b{background:#2f6fb5}.s2b{background:#0d5299}.s3b{background:var(--navy-700)}
.mrow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--s200);border-radius:18px;padding:10px 16px;margin-bottom:8px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.mrow.in{opacity:1;transform:none}
.mrow .av{width:42px;height:42px}
.mrow .who{width:230px}
.mrow .who b{font:600 15px var(--head)} .mrow .who small{display:block;color:var(--s500);font-size:12px}
.dots{display:flex;align-items:center;gap:0;flex:1;max-width:340px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--s200);flex:none}
.dots u{flex:1;height:3px;background:var(--s200)}
.dots i.f,.dots u.f{background:var(--navy)}
.sp{margin-left:auto;display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:600;gap:6px}
.sp0{background:#e3edf8;color:#1e5a9e}.sp1{background:#c9dcf1;color:#0d4a8e}.sp2{background:#9fc0e5;color:#00306a}.sp3{background:var(--navy);color:#fff}

/* ---------- profile ---------- */
.pf-back{height:38px;display:flex;align-items:center;padding:0 24px;color:var(--navy);font-weight:600;font-size:13px;gap:6px}
.pf{display:flex;gap:20px;padding:0 24px;height:488px}
.pf-left{width:300px;background:#fff;border:1px solid var(--s200);border-radius:24px;padding:20px;align-self:flex-start;display:flex;flex-direction:column;align-items:center;text-align:center}
.pf-left .av{width:108px;height:108px;box-shadow:0 0 0 4px var(--em-bg)}
.pf-left h3{font:600 22px var(--head);margin-top:10px}
.pf-left .pr{color:var(--s500);margin:2px 0 8px}
.pf-left .from{font-size:12.5px;color:var(--s600);margin-top:8px;font-weight:500}
.pf-act{width:100%;display:grid;gap:8px;margin-top:16px}
.pf-act .btn{height:40px;font-size:13.5px}
.pf-act small{font-weight:500;color:var(--s500);font-size:11px}
.btn.sent{background:var(--em);box-shadow:0 8px 18px -8px rgba(16,185,129,.7)}
.pf-view{flex:1;height:470px;overflow:hidden;border-radius:4px}
.pin{position:relative;transition:transform .85s cubic-bezier(.65,0,.35,1);display:grid;gap:12px;padding-bottom:4px}
.card{background:#fff;border:1px solid var(--s200);border-radius:20px;padding:16px 20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h4{font:600 14px var(--head);color:var(--navy);margin-bottom:8px}
.card p{font-size:13.5px;line-height:1.55;color:var(--s600);max-width:760px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px}
.kv div{font-size:13px;font-weight:500;color:var(--s900)} .kv small{display:block;font-size:11.5px;color:var(--s500);font-weight:400;margin-bottom:1px}
.lang{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lang div{font-size:13px;font-weight:500}
.lang small{color:var(--s500);font-weight:400} .lang .bar{height:6px;border-radius:9px;background:var(--s100);margin-top:6px;overflow:hidden}
.lang .bar i{display:block;height:100%;background:var(--navy);border-radius:9px}
.tl{display:grid;gap:10px}
.tl div{display:flex;gap:12px;font-size:13px}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--navy);margin-top:5px;flex:none;box-shadow:0 0 0 4px var(--navy-50)}
.tl b{font-weight:600} .tl small{display:block;color:var(--s500);font-size:12px}
.toast{position:absolute;left:50%;top:62px;transform:translate(-50%,-20px);background:var(--s900);color:#fff;padding:10px 18px;border-radius:14px;font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .35s,transform .35s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{stroke:#34d399}
.chat{position:absolute;right:16px;top:60px;bottom:16px;width:350px;background:#fff;border-radius:22px;border:1px solid var(--s200);box-shadow:0 30px 60px -20px rgba(0,40,90,.4);display:flex;flex-direction:column;transform:translateX(120%);transition:transform .6s cubic-bezier(.2,.8,.2,1);z-index:25;overflow:hidden}
.chat.on{transform:none}
.ch-h{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--navy);color:#fff}
.ch-h .gw{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font:600 13px var(--head)}
.ch-h b{font:600 15px var(--head);display:block}.ch-h small{font-size:12px;color:#c5d7ec}
.ch-b{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;background:var(--s50)}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.4;animation:popin .35s both}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--s200);border-bottom-left-radius:5px}
.msg.dots-m{display:flex;gap:4px;padding:12px 14px}
.msg.dots-m i{width:6px;height:6px;border-radius:50%;background:var(--s400);animation:bnc 1s infinite}
.msg.dots-m i:nth-child(2){animation-delay:.15s}.msg.dots-m i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{transform:none}30%{transform:translateY(-4px)}}
.ch-i{display:flex;gap:8px;padding:12px;border-top:1px solid var(--s200);background:#fff}
.ch-i .input{flex:1;height:40px;font-size:13px}
.ch-i button{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center;transition:transform .15s}
.ch-i button svg{stroke:#fff}

/* ---------- privacy ---------- */

/* ===================================================================
   MANDO  (narración + pausa + idioma)
   -------------------------------------------------------------------
   Esto NO es la maqueta del portal: es el mando de Global Working y va
   con la tipografía y los colores de la web de marca. Superficies
   planas y filetes, nunca sombras ni degradados.

   El cliente quiso ver la animación, no el mando: fuera transporte de
   capítulo, barra de progreso, puntos y reloj. Quedan dos cosas y la
   narración:
     · pausa/play  — WCAG 2.2.2: esto se mueve solo 1:14 y arranca solo,
                     así que tiene que poder pararse. Discreto, pero
                     SIEMPRE en el árbol de accesibilidad y alcanzable
                     con teclado (nunca display:none, nunca solo hover).
     · EN          — es idioma, no cromo de reproducción.

   La tarjeta de capítulo vivía DENTRO del escenario (position:absolute
   sobre el 1280x720 del mockup), así que escalaba con él y a 375 px
   quedaba ilegible — por eso existía `.capbelow` como recambio. Ahora
   es un bloque propio —el «pupitre»— que nace del borde inferior de la
   pantalla: una pieza, no dos sueltas.
   =================================================================== */

/* ---------- pausa/play ----------
   Vive en el pupitre, no flotando sobre la pantalla: encima tapaba controles
   reales de la maqueta y hacía que el producto simulado pareciera tener un
   botón suelto que no es suyo. Acá es un círculo callado, hermano del EN, y
   está SIEMPRE visible — WCAG 2.2.2 pide poder parar esto, y un control que
   solo aparece al pasar el ratón no existe en una pantalla táctil.
   En pausa se pinta navy: es el único sitio donde se lee que está parado. */
.pbtn{flex:none;width:34px;height:34px;border-radius:var(--gw-r-pill);
  border:1px solid var(--gw-line);background:#fff;color:var(--gw-navy);
  display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
.pbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.pbtn:hover{background:var(--gw-frost)}
.player.paused .pbtn{background:var(--gw-navy);border-color:var(--gw-navy);color:#fff}
.player.paused .pbtn:hover{background:var(--gw-primary-800)}
.pbtn:focus-visible{outline:2px solid var(--gw-blue);outline-offset:2px}

/* ---------- pupitre: la narración ----------
   Es lo ÚNICO que acompaña a la animación, así que no puede leerse como una
   caja pegada encima: nace del borde inferior de la pantalla, comparte ancho
   y radio con ella y cierra la pieza. Nada de sombra ni de tarjeta flotante.
   Dentro va un bloque editorial de verdad: filete de marca + capítulo en
   Poppins, titular en Poppins semibold y la explicación en Newsreader con
   medida de lectura. No es una etiqueta con una nota al pie. */
.deck{flex:none;margin-bottom:auto;background:#fff;border:1px solid var(--gw-line);border-top:0;
  border-radius:0 0 var(--gw-r-surface) var(--gw-r-surface);font-family:var(--gw-ui)}
.cap{display:flex;align-items:flex-start;gap:16px;padding:16px clamp(16px,1.7vw,22px)}
/* El número ya va dentro de «Kapittel 3/9 · …»; el azulejo navy era una
   segunda voz diciendo lo mismo. Se queda en el DOM porque el script lo pinta. */
.cap .num{display:none}
.cap .tx{min-width:0;flex:1;transition:opacity .2s ease,transform .2s ease}
.cap .tx.sw{opacity:0;transform:translateY(6px)}
.cap h3{font:600 clamp(19px,1.75vw,23px)/1.2 var(--gw-ui);letter-spacing:-.025em;color:var(--gw-navy);
  margin-top:7px}
/* El serif es para leer, no para operar: la explicación es lectura, y lleva
   medida corta (38rem, la misma de la web) para que no se vaya a línea larga. */
.cap p{font:400 clamp(15px,1.25vw,16.5px)/1.55 var(--gw-serif);color:var(--gw-ink-muted);
  margin-top:5px;max-width:38rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:calc(2 * 1.55em)}   /* dos líneas fijas: hay capítulos sin frase y
                                    sin esto el pupitre daba un salto de alto */
/* Filete de marca + capítulo: el gesto `.gw-label` de la web. Sin barra de
   progreso, esta línea es lo único que dice por dónde va el recorrido. */
.cap .chn{display:flex;align-items:flex-start;gap:12px;
  font:600 11.5px/1.35 var(--gw-ui);color:var(--gw-ink-soft)}
/* margin-top alinea el filete con la PRIMERA línea: en estrecho la etiqueta
   parte en dos y centrado quedaba flotando entre renglones. */
.cap .chn:before{content:"";display:block;width:28px;height:2px;margin-top:6px;
  background:var(--gw-ember);flex:none}
.acts{flex:none;display:flex;align-items:center;gap:8px;margin-top:-2px}
.lbtn{flex:none;height:34px;padding:0 14px;border-radius:var(--gw-r-pill);border:1px solid var(--gw-line);
  background:#fff;font:600 12.5px/1 var(--gw-ui);color:var(--gw-navy);transition:background .2s}
.lbtn:hover{background:var(--gw-frost)}
.lbtn:focus-visible{outline:2px solid var(--gw-blue);outline-offset:2px}

/* Región viva solo para lectores de pantalla: la tarjeta visible es
   aria-hidden (vive dentro del escenario inerte), así que esta es la que
   anuncia el cambio de capítulo. Antes era `display:none` en ancho, y
   display:none no se anuncia: nadie se enteraba de nada. */
.capbelow{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}

/* ---------- estrecho (< 700 px): el móvil y el iframe angosto ----------
   Ahí sobra alto (el iframe mide 560 y el recorrido no lo llena), así que la
   explicación puede respirar a tres líneas en vez de recortarse a dos. */
.player.narrow .cap{padding:14px}
.player.narrow .cap .chn:before{width:20px}
.player.narrow .cap h3{margin-top:6px}
.player.narrow .cap p{-webkit-line-clamp:3;min-height:calc(3 * 1.55em)}
/* Dedos, no ratón: los dos controles crecen a 40 px. */
.player.narrow .pbtn{width:40px;height:40px}
.player.narrow .lbtn{height:40px}
.player.inst *,.player.reduced *{transition:none!important;animation:none!important}
.player.reduced .cursor,.player.inst .cursor{display:none}
@media (prefers-reduced-motion:reduce){.ring.on{animation:none}}
</style>

/* Sin barra de progreso ni puntos, el cambio de este texto es la ÚNICA señal
   de que el recorrido avanzó: tiene que entrar y salir de una pieza, no
   parpadear dos veces.

   Al entrar en un capítulo había dos repintados seguidos — primero el nombre
   del capítulo y, ~200 ms después, el primer `cap()` con el texto real — y se
   veían dos barridos encadenados. Ahora `enter()` arranca el fundido de
   salida y ESPERA (`hold`) a que llegue ese primer `cap()`: el texto nuevo
   entra en el mismo barrido. Si no llega ninguno, a los 480 ms se pinta el
   nombre del capítulo y listo.

   CAP_OUT tiene que coincidir con la transición de `.cap .tx` (.2s). */
const CAP_OUT = 200;
let capTimer = 0, capOutAt = 0;
function paintCap(anim, hold) {
  const tx = $('#capTx');
  const apply = () => {
    capTimer = 0;
    $('#capNum').textContent = chIdx + 1;
    $('#capCh').textContent = T('chapter') + ' ' + (chIdx + 1) + '/' + CHAPTERS.length + ' · ' + T('ch' + (chIdx + 1));
    const t = curCap ? T('cap.' + curCap + '.t') : T('ch' + (chIdx + 1)), d = curCap ? T('cap.' + curCap + '.d') : '';
    $('#capT').textContent = t; $('#capD').textContent = d; $('#capT2').textContent = t; $('#capD2').textContent = d;
    tx.classList.remove('sw');
  };
  if (capTimer) { clearTimeout(capTimer); capTimer = 0; }
  if (!anim || inst) { apply(); return; }
  const now = performance.now();
  if (!tx.classList.contains('sw')) { capOutAt = now; tx.classList.add('sw'); }
  const left = Math.max(0, CAP_OUT - (now - capOutAt));
  capTimer = setTimeout(apply, hold ? Math.max(left, hold) : left);
}

const N = CHAPTERS.length;
const TOTAL = CHAPTERS.reduce((a, c) => a + c.dur, 0);
const START = []; CHAPTERS.reduce((a, c, i) => (START[i] = a, a + c.dur), 0);

/* ===================== PLAYER ===================== */
let ci = 0, t = 0, fired = 0, tweens = [], playing = false, userPaused = false, onScreen = true, inst = false, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastTs = 0;

function enter(i, instant) {
  ci = (i + N) % N; chIdx = ci; t = 0; fired = 0; tweens = []; curCap = null;
  unhl(); if (ci === 0) { cursor.classList.remove('on'); }
  $$('.scene').forEach(s => s.classList.toggle('on', s.dataset.scene === CHAPTERS[ci].scene));
  const prevInst = inst; if (instant) { inst = true; player.classList.add('inst'); }
  CHAPTERS[ci].setup();
  /* Arranca el fundido de salida y espera hasta 480 ms al primer `cap()` del
     capítulo, para que el texto nuevo entre en ese mismo barrido. */
  paintCap(!instant, 480);
  if (instant) {
    for (const s of CHAPTERS[ci].steps) { s.run && s.run(); s.tick && s.tick(1); }
    fired = CHAPTERS[ci].steps.length; t = CHAPTERS[ci].dur * 1000;
    void stage.offsetWidth;
    requestAnimationFrame(() => { inst = prevInst || reduced; if (!inst) player.classList.remove('inst'); });
    paintCap(false);
  }
}
function stepEngine() {
  const ch = CHAPTERS[ci];
  while (fired < ch.steps.length && ch.steps[fired].at * 1000 <= t) {
    const s = ch.steps[fired++];
    if (s.run) s.run();
    if (s.dur) tweens.push({s, start: s.at * 1000});
  }
  tweens = tweens.filter(w => { const p = Math.min(1, (t - w.start) / (w.s.dur * 1000)); w.s.tick(p); return p < 1; });
  if (t >= ch.dur * 1000) enter(ci + 1);
}
function frame(ts) {
  const dt = Math.min(ts - lastTs, 100); lastTs = ts;
  if (playing) { t += dt; stepEngine(); }
  requestAnimationFrame(frame);
}
function setPlaying() {
  playing = !userPaused && onScreen && !reduced;
  $('#icPause').style.display = playing ? '' : 'none';
  $('#icPlay').style.display = playing ? 'none' : '';
  $('#bPlay').setAttribute('aria-label', playing ? T('pause') : T('play'));
  $('#bPlay').style.display = reduced ? 'none' : '';
  /* En pausa el botón se queda visible: si desapareciera no habría forma
     de reanudar con el ratón. */
  player.classList.toggle('paused', !playing && !reduced);
}
function jump(i) { enter(i, !(playing)); setPlaying(); }

/* controls — solo pausa/play e idioma; el transporte de capítulo, la barra,
   los puntos y el reloj se quitaron (el cliente quiere ver la animación).
   Las flechas siguen saltando de capítulo porque no cuestan cromo. */
$('#bPlay').onclick = () => { userPaused = !userPaused; if (!userPaused && t >= CHAPTERS[ci].dur * 1000) enter(ci, false); setPlaying(); };
$('#bLang').onclick = () => setLang(lang === 'nb' ? 'en' : 'nb');
player.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { jump(ci + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { jump(ci - 1); e.preventDefault(); }
  else if (e.key === ' ' && e.target === player) { $('#bPlay').click(); e.preventDefault(); }
});

const deckEl = document.querySelector('.deck');
if (deckEl) new ResizeObserver(() => {
  document.documentElement.style.setProperty('--deck-h', Math.ceil(deckEl.getBoundingClientRect().height) + 'px');
}).observe(deckEl);

/* misc */
$('#cta').href = CTA_URL; $('#cta').target = CTA_TARGET;
document.addEventListener('visibilitychange', () => { onScreen = !document.hidden; setPlaying(); });
if ('IntersectionObserver' in window) new IntersectionObserver(es => { onScreen = es[0].isIntersecting && !document.hidden; setPlaying(); }, {threshold: .25}).observe(wrap);
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', e => { reduced = e.matches; player.classList.toggle('reduced', reduced); inst = reduced; enter(ci, reduced); setPlaying(); });

/* boot */
player.classList.toggle('reduced', reduced); inst = reduced;
fit(); setLang(DEFAULT_LANG);
if (!AUTOPLAY) userPaused = true;
enter(0, reduced); setPlaying();
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });

window.GWTour = {jump, chapters: CHAPTERS, total: TOTAL, setLang, state: () => ({ci, t, playing})};
})();
</script>
</body>
</html>
